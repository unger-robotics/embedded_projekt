; firmware/platformio.ini
[platformio]
default_envs = seeed_xiao_esp32s3_freertos
;default_envs = seeed_xiao_esp32s3_loop

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; Falls Port-Autodetect zickt, hier fest eintragen:
;upload_port = /dev/cu.usbmodem14501
;test_port   = /dev/cu.usbmodem14501

build_flags =
  -D CORE_DEBUG_LEVEL=0

; =========================
; Firmware Environments
; =========================
[env:seeed_xiao_esp32s3_freertos]
build_flags =
  ${env.build_flags}
  -D APP_USE_FREERTOS=1

[env:seeed_xiao_esp32s3_loop]
build_flags =
  ${env.build_flags}
  -D APP_USE_FREERTOS=0

; =========================
; Test Environments
; =========================
[env:seeed_xiao_esp32s3_test]
test_framework = unity
test_build_src = true

; Unit-Tests sollen nur die echte Logik bauen
build_src_filter =
  +<logic/>
  -<app/>
  -<drivers/>
  -<hal/>
  -<protocol/>
  -<main.cpp>

build_flags =
  ${env.build_flags}

[env:seeed_xiao_esp32s3_e2e]
test_framework = unity
test_build_src = true

; E2E braucht Logic + Hardwarepfad (Drivers/HAL)
build_src_filter =
  +<logic/>
  +<drivers/>
  +<hal/>
  -<app/>
  -<protocol/>
  -<main.cpp>

build_flags =
  ${env.build_flags}
